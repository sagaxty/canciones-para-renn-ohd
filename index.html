<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Beatles for Ren<33</title>

    <!-- AQUÍ EMPIEZA EL CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            touch-action: manipulation; 
        }
        .reproductor-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .oculto { display: none !important; }
        .pantalla-interactiva h2 { font-size: 1.6rem; margin-bottom: 15px; color: #f39c12; }
        .pantalla-interactiva p { font-size: 1rem; color: #b3b3b3; margin-bottom: 30px; }
        .btn-retro {
            background-color: #f39c12; color: #000; border: none; padding: 15px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4); -webkit-tap-highlight-color: transparent;
        }
        .titulo-cancion { font-size: 1.8rem; margin-bottom: 5px; color: #f39c12; }
        .subtitulo { font-size: 1rem; color: #b3b3b3; margin-bottom: 25px; }
        .disco-wrapper {
            width: 220px; height: 220px; margin: 0 auto 25px auto;
            border-radius: 50%; overflow: hidden; border: 5px solid #333;
        }
        .disco-imagen { width: 100%; height: 100%; object-fit: cover; }
        .rota { animation: girarDisco 8s linear infinite; }
        @keyframes girarDisco { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .mensaje-amor { margin-top: 25px; font-style: italic; color: #f39c12; font-size: 1.1rem; }
    </style>
    <!-- AQUÍ TERMINA EL CSS -->

</head>
<body>

    <div class="reproductor-container">
        <!-- PANTALLA DE INICIO -->
        <div id="pantalla-inicio" class="pantalla-interactiva">
            <h2>🎵-Disko Detektado-🎵</h2>
            <p>Ya puedes pushar el botonsito de abajo y el interruptor de el tokadiskitos para escucharr.  
                 -Con kariño Santy<3 </p>
            <button id="btn-comenzar" class="btn-retro">Pushame >:v</button>
        </div>

        <!-- CONTENIDO DEL REPRODUCTOR -->
        <div id="contenido-reproductor" class="oculto">
            <h1 class="titulo-cancion">Oh Darling!</h1>
            <p class="subtitulo">The Beatles</p>

            <div class="disco-wrapper">
                <img src="imagenes/record.gif" alt="Portada" class="disco-imagen rota">
            </div>

            <audio id="mi-audio" loop playsinline>
                <source src="musica/Oh! Darling (Remastered 2009).mp3" type="audio/mpeg">
            </audio>
            
            <div class="mensaje-amor">
                <p> omaigat mclennon 'O' </p>
            </div>
        </div>
    </div>

    <script>
        const btnComenzar = document.getElementById('btn-comenzar');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const contenidoReproductor = document.getElementById('contenido-reproductor');
        const audio = document.getElementById('mi-audio');

        btnComenzar.addEventListener('click', () => {
            audio.play().then(() => {
                pantallaInicio.style.display = 'none';
                contenidoReproductor.classList.remove('oculto');
            }).catch(e => console.log(e));
        });
    </script>
</body>
</html>
